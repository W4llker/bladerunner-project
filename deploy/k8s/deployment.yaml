apiVersion: apps/v1
kind: Deployment
metadata:
  name: bladerunner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bladerunner
  template:
    metadata:
      labels:
        app: bladerunner
    spec:
      containers:
        - name: bladerunner
          image: ghcr.io/W4llker/bladerunner:latest
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
