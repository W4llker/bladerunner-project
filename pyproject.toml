[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bladerunner-agent-hunter"
version = "0.1.0"
description = "Open source framework to detect, contain and neutralize rogue autonomous agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Bladerunner Contributors" }]
keywords = ["ai-safety", "cybersecurity", "agents", "llm", "monitoring"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "psutil>=5.9",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
ml = [
    "datasets>=2.18",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.scripts]
bladerunner = "bladerunner.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
